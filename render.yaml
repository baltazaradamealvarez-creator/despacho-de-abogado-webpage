    source: /blog
    destination: /perspectivas/
  - type: redirect
    source: /en/blog-2
    destination: /en/insights/
  - type: redirect
    source: /en/about-us
    destination: /en/about/
  - type: redirect
    source: /cancelacion-de-cfdi-en-2025-reglas-plazos-y-consejos-para-evitar-sanciones/
    destination: /perspectivas/archivo/cancelacion-de-cfdi-en-2025-reglas-plazos-y-consejos-para-evitar-sanciones/
  - type: redirect
    source: /declaracion-anual-de-personas-fisicas-todo-lo-que-necesitas-saber/
    destination: /perspectivas/archivo/declaracion-anual-de-personas-fisicas-todo-lo-que-necesitas-saber/
